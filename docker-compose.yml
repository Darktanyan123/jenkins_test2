# ==========================================================
# Docker Compose - Resume Analyser (Full Stack + Database)
# Tích hợp trọn gói MongoDB (có sẵn dữ liệu) + Backend + Frontend
# ==========================================================

services:
  mongodb:
    image: ${MONGO_IMAGE:-hoang2207/resume-mongodb}:${VERSION:-latest}
    container_name: resume-mongodb
    ports:
      - "27017:27017"
    volumes:
      # Lưu trữ các dữ liệu mới tạo thêm sau này
      - mongo-data:/data/db
    networks:
      - resume-network
    restart: always
  # --- Backend (Spring Boot API) ---
  backend:
    image: ${BACKEND_IMAGE:-hoang2207/resume-backend}:${VERSION:-latest}
    build:
      context: ./backend
    container_name: resume-backend
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      # Kết nối trực tiếp tới container mongodb bên trên
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/cv_screening
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the local .env file}
      # Chỉ Compose local mở endpoint để Prometheus thu thập metrics.
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus
    depends_on:
      - mongodb
    networks:
      - resume-network
    restart: always
  # --- Frontend (React + Nginx) ---
  frontend:
    image: ${FRONTEND_IMAGE:-hoang2207/resume-frontend}:${VERSION:-latest}
    build:
      context: ./frontend
    container_name: resume-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - resume-network
    restart: always
  prometheus:
    image: ${PROMETHEUS_IMAGE:-hoang2207/resume-prometheus}:${VERSION:-latest}
    build:
      context: ./prometheus-init
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - resume-network
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    ports:
      - "9100:9100"
    networks:
      - resume-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin #
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3001"
    depends_on:
      - prometheus
    networks:
      - resume-network
# Volume lưu trữ dữ liệu database
volumes:
  mongo-data:
  prometheus_data:
  grafana_data: # Network kết nối 3 container
networks:
  resume-network:
    name: resume-network
